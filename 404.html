<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 - Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-white font-serif min-h-screen">
    <section class="min-h-screen flex items-center justify-center">
      <div class="container mx-auto">
        <div class="flex justify-center">
          <div class="w-full sm:w-10/12 md:w-8/12 text-center">
            <div
              class="bg-[url('https://cdn.dribbble.com/users/285475/screenshots/2083086/dribbble_1.gif')] h-[250px] sm:h-[350px] md:h-[400px] bg-center bg-no-repeat bg-contain"
              aria-hidden="true"
            >
              <h1 class="text-center text-black text-6xl sm:text-7xl md:text-8xl pt-6 sm:pt-8">404</h1>
            </div>

            <div class="mt-[-50px]">
              <h3 class="text-2xl text-black sm:text-3xl font-bold mb-4">Look like you're lost</h3>
              <p class="mb-6 text-black sm:mb-5">The page you are looking for is not available!</p>

              <a href="https://charanbs18.github.io/my-website/" class="inline-block my-5 px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded" target="_self" rel="noopener">
                Go to Home
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
